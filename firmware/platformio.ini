[platformio]
; 환경을 따로 지정하지 않았을 때 기본으로 ESP32-C3 펌웨어를 빌드합니다.
default_envs = esp32-c3-devkitm-1

[env:esp32-c3-devkitm-1]
; 로거 펌웨어에서 사용하는 ESP32-C3 DevKitM-1 보드와 Arduino 프레임워크입니다.
platform = espressif32@6.11.0
board = esp32-c3-devkitm-1
framework = arduino

; FT26 COM 프로토콜과 맞추기 위해 시리얼 모니터와 업로드 속도를 921600 bps로 둡니다.
monitor_speed = 921600
upload_speed = 921600

; I2C 보조 기능, ADS1115 ADC, DS3231M RTC를 사용하기 위한 라이브러리입니다.
lib_deps =
  adafruit/Adafruit BusIO@1.17.4
  adafruit/Adafruit ADS1X15@2.6.2
  adafruit/RTClib@2.1.4

; 펌웨어와 공용 로거 코드 모두 C++17로 빌드하고 주요 경고를 켭니다.
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  ; 리셋 후 Web Serial/COM 명령이 바로 동작하도록 부팅 시 USB CDC 시리얼을 켭니다.
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
build_unflags =
  -std=gnu++11

[env:native]
; 공용 프로토콜과 로그 포맷 코드를 PC에서 테스트하기 위한 환경입니다.
platform = native
platform_packages = platformio/toolchain-gccmingw32
extra_scripts = pre:scripts/native_toolchain.py
test_framework = unity
test_build_src = yes
build_unflags =
  -std=gnu++11
build_src_filter =
  ; ESP32 전용 라이브러리에 의존하지 않는 소스 파일만 컴파일합니다.
  +<log_format.cpp>
  +<com_protocol.cpp>
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -Wpedantic
