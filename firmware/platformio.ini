[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 921600
upload_speed = 921600

lib_deps =
  adafruit/Adafruit BusIO
  adafruit/Adafruit ADS1X15
  adafruit/RTClib

build_flags =
  -std=gnu++17
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
